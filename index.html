<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<!-- Compass favicon (SVG inline as data URI) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230D2B5E'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='1.2'/%3E%3Cpolygon points='16,16 13,22 16,20 19,22' fill='white'/%3E%3Cpolygon points='16,16 13,10 16,12 19,10' fill='rgba(255,255,255,0.55)'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='white'/%3E%3Cline x1='16' y1='6.5' x2='16' y2='8.5' stroke='white' stroke-width='1.2'/%3E%3Cline x1='16' y1='23.5' x2='16' y2='25.5' stroke='white' stroke-width='1.2'/%3E%3Cline x1='6.5' y1='16' x2='8.5' y2='16' stroke='white' stroke-width='1.2'/%3E%3Cline x1='23.5' y1='16' x2='25.5' y2='16' stroke='white' stroke-width='1.2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f4f6;--surface:#fff;--ink:#16202a;--mute:#5d6b78;--line:#d9dfe5;--accent:#1f6f78;--accent-ink:#fff;--danger:#b3372f;--chip:#dfeceb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--surface:#1a2128;--ink:#e8edf1;--mute:#93a1ad;--line:#2b353e;--accent:#58b7c1;--accent-ink:#0b1417;--danger:#ef7d74;--chip:#21323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--surface:#1a2128;--ink:#e8edf1;--mute:#93a1ad;--line:#2b353e;--accent:#58b7c1;--accent-ink:#0b1417;--danger:#ef7d74;--chip:#21323a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.7rem;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
/* Compass logo in header */
.logo{width:32px;height:32px;flex-shrink:0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;color:var(--mute);font:inherit;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.grow{flex:1 1 160px}
button{font:inherit}
.pri{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.ghost{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 8px;border-radius:6px}
.ghost:hover{color:var(--ink)}
.del:hover{color:var(--danger)}
.on{background:var(--chip);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.item.n{grid-template-columns:1fr auto}
.time{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.9rem;min-width:96px;padding-top:2px}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.meta{color:var(--mute);font-size:.85rem}
.chip{display:inline-block;background:var(--chip);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px}
.body{white-space:pre-wrap;margin:4px 0 0}
.empty{color:var(--mute);padding:18px 0}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
footer{margin-top:28px;color:var(--mute);font-size:.9rem}
summary{cursor:pointer}
footer textarea{margin:8px 0;min-height:70px;font-size:.8rem}
/* Forgot password link */
.link-btn{background:none;border:0;color:var(--accent);font:inherit;font-size:.88rem;cursor:pointer;padding:0;text-decoration:underline}
.link-btn:hover{opacity:.8}
/* Auth message (success / error) */
#auth-msg{font-size:.88rem;margin-top:6px;min-height:1.4em}
#auth-msg.ok{color:var(--accent)}
#auth-msg.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>
    <!-- Inline SVG compass logo -->
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#0D2B5E"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.2"/>
      <polygon points="16,16 13,22 16,20 19,22" fill="white"/>
      <polygon points="16,16 13,10 16,12 19,10" fill="rgba(255,255,255,0.55)"/>
      <circle cx="16" cy="16" r="1.8" fill="white"/>
      <line x1="16" y1="6.5" x2="16" y2="8.5" stroke="white" stroke-width="1.2"/>
      <line x1="16" y1="23.5" x2="16" y2="25.5" stroke="white" stroke-width="1.2"/>
      <line x1="6.5" y1="16" x2="8.5" y2="16" stroke="white" stroke-width="1.2"/>
      <line x1="23.5" y1="16" x2="25.5" y2="16" stroke="white" stroke-width="1.2"/>
    </svg>
    Daybook
  </h1>
  <div>
    <button class="ghost" data-act="out" id="out" hidden>Sign out</button>
    <button class="ghost" data-act="theme">Light / dark</button>
  </div>
</header>

<!-- Login panel -->
<div id="login" class="panel" hidden>
  <div class="row">
    <input id="em" type="email" class="grow" placeholder="Email" aria-label="Email">
    <input id="pw" type="password" class="grow" placeholder="Password" aria-label="Password">
  </div>
  <div class="row">
    <button class="pri" data-act="signin">Sign in</button>
    <button class="ghost" data-act="signup">Create account</button>
  </div>
  <div class="row" style="margin-top:4px">
    <button class="link-btn" data-act="forgot">Forgot password?</button>
  </div>
  <p id="auth-msg" role="status"></p>
</div>

<div id="app"></div>

<footer>
  <p id="msg" class="meta" role="status"></p>
</footer>
</div>
<script type="module">
const KEY = "daybook:v1";
const TABS = [["timebox","Timebox"],["notes","Notes"],["dreams","Dreams"],["bucket","Bucket list"]];
const KM = {timebox:"blocks", notes:"notes", dreams:"dreams", bucket:"bucket"};
const NT = ["Journal","Learning","Thoughts","Ideas"];
const DT = ["Normal","Recurring","Nightmare","Lucid"];
const BC = ["Travel","Growth","Career","Health","Family","Finance","Adventure","Other"];
const BS = ["Dream","Planned","Done"];
let S = {blocks:[], notes:[], dreams:[], bucket:[]};
let tab = "timebox", editing = null, q = "", bf = "All";
const $app = document.getElementById("app");

const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
let day = today();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const fdate = s => new Date(s.length > 10 ? s : s + "T00:00").toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short", year:"numeric"});
const opt = (arr, v) => arr.map(a => `<option${a === v ? " selected" : ""}>${a}</option>`).join("");
const cur = () => editing ? (S[KM[tab]].find(x => x.id === editing) || {}) : {};
const acts = id => `<div><button class="ghost" data-act="edit" data-id="${id}">Edit</button><button class="ghost del" data-act="del" data-id="${id}">Delete</button></div>`;

try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
try { const t = localStorage.getItem("daybook:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { msg("Could not save in this browser. Use Backup and restore to keep a copy."); } }
let mt;
function msg(t) { const m = document.getElementById("msg"); m.textContent = t; clearTimeout(mt); mt = setTimeout(() => m.textContent = "", 5000); }

/** Show message inside the login panel (success = green, error = red) */
function authMsg(text, isOk = false) {
  const el = document.getElementById("auth-msg");
  el.textContent = text;
  el.className = isOk ? "ok" : "err";
}

function form() {
  const e = cur(), id = e.id || "";
  const hid = `<input type="hidden" name="id" value="${id}">`;
  const btns = `<div class="row"><button class="pri">${id ? "Save changes" : "Add"}</button>${id ? `<button type="button" class="ghost" data-act="cancel">Cancel</button>` : ""}</div>`;
  if (tab === "timebox") return `<form class="panel" data-t="timebox">${hid}<div class="row"><input type="time" name="start" required value="${e.start || "09:00"}" aria-label="Start time"><input type="time" name="end" required value="${e.end || "10:00"}" aria-label="End time"><input class="grow" name="title" required placeholder="What will you do in this block?" value="${esc(e.title)}"></div>${btns}</form>`;
  if (tab === "notes") return `<form class="panel" data-t="notes">${hid}<div class="row"><input class="grow" name="title" required placeholder="Title" value="${esc(e.title)}"><select name="tag" aria-label="Type">${opt(NT, e.tag)}</select></div><div class="row"><textarea name="body" placeholder="Write your note, lesson, or thought">${esc(e.body)}</textarea></div>${btns}</form>`;
  if (tab === "dreams") {
    const sl = [1,2,3,4,5].map(n => `<option value="${n}"${(+e.sleep || 3) === n ? " selected" : ""}>Sleep ${n}/5</option>`).join("");
    return `<form class="panel" data-t="dreams">${hid}<div class="row"><input type="date" name="date" required value="${e.date || today()}" aria-label="Date"><input class="grow" name="title" required placeholder="Dream title" value="${esc(e.title)}"><select name="type" aria-label="Dream type">${opt(DT, e.type)}</select><select name="sleep" aria-label="Sleep quality">${sl}</select></div><div class="row"><textarea name="body" placeholder="What happened in the dream?">${esc(e.body)}</textarea></div>${btns}</form>`;
  }
  return `<form class="panel" data-t="bucket">${hid}<div class="row"><input class="grow" name="title" required placeholder="A dream, goal, or place" value="${esc(e.title)}"><select name="cat" aria-label="Category">${opt(BC, e.cat)}</select><select name="status" aria-label="Status">${opt(BS, e.status)}</select><input type="number" name="year" min="2024" max="2100" placeholder="Target year" value="${e.year || ""}" style="width:130px"></div>${btns}</form>`;
}

function lTime() {
  const bs = S.blocks.filter(b => b.day === day).sort((a, b) => a.start.localeCompare(b.start));
  if (!bs.length) return `<p class="empty">Nothing planned for this day. Add your first block above.</p>`;
  const m = t => +t.slice(0, 2) * 60 + +t.slice(3);
  const h = bs.reduce((s, b) => s + m(b.end) - m(b.start), 0) / 60;
  const d = bs.filter(b => b.done).length;
  return `<p class="meta">${d} of ${bs.length} done, ${Math.round(h * 10) / 10} h planned</p>` + bs.map(b => `<div class="item${b.done ? " done" : ""}"><div class="time">${b.start} – ${b.end}</div><label><input type="checkbox" data-act="tick" data-id="${b.id}"${b.done ? " checked" : ""}> <span class="t">${esc(b.title)}</span></label>${acts(b.id)}</div>`).join("");
}
function lNotes() {
  const t = q.toLowerCase();
  const xs = S.notes.filter(n => (n.title + " " + n.body + " " + n.tag).toLowerCase().includes(t)).sort((a, b) => b.upd - a.upd);
  if (!xs.length) return `<p class="empty">${S.notes.length ? "No notes match your search." : "No notes yet. Capture a thought, a lesson, or a journal entry above."}</p>`;
  return xs.map(n => `<div class="item n"><div><div class="meta"><span class="chip">${esc(n.tag)}</span>${fdate(new Date(n.upd).toISOString())}</div><strong>${esc(n.title)}</strong><p class="body">${esc(n.body)}</p></div>${acts(n.id)}</div>`).join("");
}
function lDreams() {
  const t = q.toLowerCase();
  const xs = S.dreams.filter(n => (n.title + " " + n.body + " " + n.feeling + " " + n.type).toLowerCase().includes(t)).sort((a, b) => b.date.localeCompare(a.date));
  if (!xs.length) return `<p class="empty">${S.dreams.length ? "No dreams match your search." : "No dreams yet. Write one down right after waking up."}</p>`;
  return xs.map(n => `<div class="item n"><div><div class="meta"><span class="chip">${esc(n.type)}</span>${fdate(n.date)}, sleep ${esc(n.sleep)}/5</div><strong>${esc(n.title)}</strong><p class="body">${esc(n.body)}</p>${n.feeling ? `<div class="meta">Felt: ${esc(n.feeling)}</div>` : ""}</div>${acts(n.id)}</div>`).join("");
}
function lBucket() {
  const rank = {Planned: 0, Dream: 1, Done: 2};
  const xs = S.bucket.filter(x => bf === "All" || x.status === bf).sort((a, b) => rank[a.status] - rank[b.status] || (a.year || 9999) - (b.year || 9999));
  const done = S.bucket.filter(x => x.status === "Done").length;
  if (!xs.length) return `<p class="empty">${S.bucket.length ? "Nothing with this status yet." : "Your list is empty. Add the first thing you want to do in your life."}</p>`;
  return `<p class="meta">${done} of ${S.bucket.length} done</p>` + xs.map(x => `<div class="item${x.status === "Done" ? " done" : ""}"><button class="ghost" data-act="cycle" data-id="${x.id}" title="Change status"><span class="chip">${x.status}</span></button><div><strong class="t">${esc(x.title)}</strong><div class="meta">${esc(x.cat)}${x.year ? ", " + x.year : ""}</div></div>${acts(x.id)}</div>`).join("");
}
const list = () => ({timebox: lTime, notes: lNotes, dreams: lDreams, bucket: lBucket})[tab]();
const paint = () => { document.getElementById("list").innerHTML = list(); };

function render() {
  const nav = `<nav role="tablist">${TABS.map(([v, l]) => `<button role="tab" aria-selected="${tab === v}" data-act="tab" data-v="${v}">${l}</button>`).join("")}</nav>`;
  let top = "";
  if (tab === "timebox") top = `<div class="bar"><div class="row"><button class="ghost" data-act="prev" aria-label="Previous day">&lsaquo;</button><input type="date" id="day" value="${day}" aria-label="Day"><button class="ghost" data-act="next" aria-label="Next day">&rsaquo;</button></div><button class="ghost" data-act="today">Today</button></div>`;
  else if (tab === "bucket") top = `<div class="bar"><div class="row">${["All", ...BS].map(v => `<button class="ghost${bf === v ? " on" : ""}" data-act="bf" data-v="${v}">${v}</button>`).join("")}</div></div>`;
  else top = `<div class="bar"><input type="search" id="q" class="grow" placeholder="Search" aria-label="Search" value="${esc(q)}"></div>`;
  $app.innerHTML = nav + (tab === "timebox" ? top + form() : form() + top) + `<div id="list">${list()}</div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "tab") { tab = b.dataset.v; editing = null; q = ""; render(); }
  else if (a === "prev" || a === "next") { const d = new Date(day + "T00:00"); d.setDate(d.getDate() + (a === "next" ? 1 : -1)); day = ymd(d); render(); }
  else if (a === "today") { day = today(); render(); }
  else if (a === "edit") { editing = id; render(); window.scrollTo({top: 0}); }
  else if (a === "cancel") { editing = null; render(); }
  else if (a === "del") {
    if (b.dataset.arm) {
      const k = KM[tab]; S[k] = S[k].filter(x => x.id !== id); rm(k, id); editing = null; render();
    } else {
      b.dataset.arm = 1; b.textContent = "Confirm?";
      setTimeout(() => { if (b.dataset.arm) { b.textContent = "Delete"; delete b.dataset.arm; } }, 3000);
    }
  }
  else if (a === "tick") { const x = S.blocks.find(x => x.id === id); x.done = !x.done; put("blocks", x); paint(); }
  else if (a === "cycle") { const x = S.bucket.find(x => x.id === id); x.status = BS[(BS.indexOf(x.status) + 1) % 3]; put("bucket", x); paint(); }
  else if (a === "bf") { bf = b.dataset.v; render(); }
  else if (a === "theme") {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("daybook:theme", r.dataset.theme); } catch (x) {}
  }
  else if (a === "copy") {
    const t = document.getElementById("bkt"); t.select();
    try { navigator.clipboard.writeText(t.value).then(() => msg("Copied."), () => msg("Press Ctrl+C to copy the selected text.")); } catch (x) { msg("Press Ctrl+C to copy the selected text."); }
  }
  else if (a === "restore") {
    try {
      const d = JSON.parse(document.getElementById("bkt").value);
      for (const k of Object.keys(S)) if (!Array.isArray(d[k])) throw 0;
      S = {blocks: d.blocks, notes: d.notes, dreams: d.dreams, bucket: d.bucket}; save(); editing = null; render(); msg("Backup restored.");
    } catch (x) { msg("That text is not a valid backup."); }
  }
});
document.addEventListener("change", e => { if (e.target.id === "day" && e.target.value) { day = e.target.value; render(); } });
document.addEventListener("input", e => { if (e.target.id === "q") { q = e.target.value; paint(); } });
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-t]"); if (!f) return;
  e.preventDefault();
  const o = Object.fromEntries(new FormData(f)), k = KM[f.dataset.t], id = o.id; delete o.id;
  if (f.dataset.t === "timebox") { if (o.end <= o.start) { msg("End time must be after the start time."); return; } if (!id) o.day = day; }
  if (f.dataset.t === "bucket") o.year = o.year ? +o.year : "";
  const it = id ? Object.assign(S[k].find(x => x.id === id), o, {upd: Date.now()}) : Object.assign({id: uid(), done: false, upd: Date.now()}, o);
  put(k, it); editing = null; render();
});
render();

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyAxv4f90OsOqstlenr8iHNoWxyD3uldKxY",
  authDomain: "daybook-53705.firebaseapp.com",
  projectId: "daybook-53705",
  storageBucket: "daybook-53705.firebasestorage.app",
  messagingSenderId: "2849436950",
  appId: "1:2849436950:web:3263238225f23da5988c37"
});

const auth = getAuth(fb), db = getFirestore(fb);
let uidCur = null, unsub = null, first = true;
const KIND = {blocks: "block", notes: "note", dreams: "dream", bucket: "bucket"};
const colRef = () => collection(db, "users", uidCur, "entries");

function toDoc(k, x) {
  const b = {type: KIND[k], title: x.title, upd: x.upd || Date.now()};
  if (k === "blocks")  Object.assign(b, {date: x.day, start: x.start, end: x.end, done: !!x.done});
  if (k === "notes")   Object.assign(b, {body: x.body || "", tag: x.tag});
  if (k === "dreams")  Object.assign(b, {body: x.body || "", date: x.date, tag: x.type, sleep: +x.sleep || 3});
  if (k === "bucket")  Object.assign(b, {tag: x.cat, status: x.status, year: +x.year || 0});
  return b;
}
function fromDoc(id, d) {
  const upd = d.upd || 0;
  if (d.type === "block")  return ["blocks", {id, title: d.title, day: d.date, start: d.start || "09:00", end: d.end || "10:00", done: !!d.done, upd}];
  if (d.type === "note")   return ["notes",  {id, title: d.title, body: d.body || "", tag: d.tag || "Journal", upd}];
  if (d.type === "dream")  return ["dreams", {id, title: d.title, body: d.body || "", date: d.date || today(), type: d.tag || "Normal", sleep: d.sleep || 3, feeling: "", upd}];
  if (d.type === "bucket") return ["bucket", {id, title: d.title, cat: d.tag || "Other", status: d.status || "Dream", year: d.year || "", upd}];
  return null;
}

const put = (k, x) => setDoc(doc(colRef(), x.id), toDoc(k, x), {merge: true}).catch(e => msg("Could not save: " + e.message));
const rm  = (k, id) => deleteDoc(doc(colRef(), id)).catch(e => msg("Could not delete: " + e.message));

// ── Auth button handler (signin / signup / forgot / signout) ──────────────
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;

  if (a === "signin" || a === "signup") {
    const em = document.getElementById("em").value.trim();
    const pw = document.getElementById("pw").value;
    authMsg(""); // clear previous message
    const fn = a === "signin" ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
    fn(auth, em, pw).catch(x => authMsg(x.message));

  } else if (a === "forgot") {
    const em = document.getElementById("em").value.trim();
    authMsg(""); // clear previous message
    if (!em) { authMsg("Enter your email address first."); return; }
    sendPasswordResetEmail(auth, em)
      .then(() => authMsg("Password reset email sent! Check your inbox.", true))
      .catch(x => authMsg(x.message));

  } else if (a === "out") {
    signOut(auth);
  }
});

onAuthStateChanged(auth, u => {
  if (unsub) { unsub(); unsub = null; }
  uidCur = u ? u.uid : null; first = true; editing = null;
  document.getElementById("login").hidden = !!u;
  document.getElementById("out").hidden = !u;
  $app.hidden = !u;
  S = {blocks: [], notes: [], dreams: [], bucket: []};
  if (!u) { $app.innerHTML = ""; authMsg(""); return; }
  unsub = onSnapshot(colRef(), snap => {
    const n = {blocks: [], notes: [], dreams: [], bucket: []};
    snap.forEach(d => { const r = fromDoc(d.id, d.data()); if (r) n[r[0]].push(r[1]); });
    S = n;
    if (first) { first = false; render(); } else paint();
  }, err => msg(err.message));
});
</script>
